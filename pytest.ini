[pytest]
# Register custom markers for the test framework
markers =
    functional: Mark test as a functional test
    ui: Mark test as a UI test
    security: Mark test as a security test
    regression: Mark test as a regression test
    autonomous: Mark test as an autonomous test
    
# Specify test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# HTML report options
addopts = -v

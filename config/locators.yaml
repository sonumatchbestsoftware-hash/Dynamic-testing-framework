# Element locators used by Selenium tests

homepage:
  logo: 
    by: "css selector"
    value: "img[alt*='logo'], img.site-logo"
  primary_cta: 
    by: "css selector"
    value: "a.btn, button.btn, [data-test='primary-cta']"

auth:
  username:
    by: "css selector"
    value: "input[name='email'], input[type='email']"

  password:
    by: "css selector"
    value: "input[name='password'], input[type='password']"

  submit:
    by: "css selector"
    value: "button[type='submit'], button:contains('Sign In')"
